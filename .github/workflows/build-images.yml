# .github/workflows/build-images.yml
#
# Full-source OpenWrt build of the GL.iNet GL-SFT1200 image, run in GitHub
# Actions. Drop this into a fork that is "OpenWrt main + our commits"
# (branch e.g. `gl-sft1200`). On a tag push it publishes the images to a
# GitHub Release so people can just download them.
#
# Why a full source build (not the SDK/ImageBuilder): our work patches the
# kernel (generic/ backport + target files) and adds a target/device, so the
# prebuilt SDK and ImageBuilder can't produce it — we have to build buildroot.

name: Build GL-SFT1200 images

on:
  push:
    branches: [ gl-sft1200 ]
    tags: [ 'v*' ]            # tag (e.g. v25.12-sft1200-1) -> Release
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write             # needed to create Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false   # keep build toolchains apt may still need

      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake \
            autopoint binutils bison build-essential bzip2 ccache cmake cpio \
            curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs ninja-build p7zip-full patch \
            pkgconf python3 python3-pyelftools python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            unzip vim wget xmlto xxd zlib1g-dev

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (GL-SFT1200 only)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a2890=y
          CONFIG_TARGET_siflower_sf19a2890_DEVICE_glinet_gl-sft1200=y
          # keep the kernel <= 3 MB for GL U-Boot's fixed read
          CONFIG_KERNEL_CC_OPTIMIZE_FOR_SIZE=y
          # compiler cache - pairs with the actions/cache step below
          CONFIG_CCACHE=y
          # web UI
          CONFIG_PACKAGE_luci=y
          # WiFi (out-of-tree sf_smac driver + default config) - fork only
          CONFIG_PACKAGE_kmod-sf_smac=y
          EOF
          make defconfig

      # Cache the toolchain + ccache the way OpenWrt forks actually do it.
      # cachewrtbuild knows OpenWrt's layout: on a cache hit it SKIPS
      # recompiling the toolchain entirely (the single biggest time sink),
      # not just object files. No prefix because our repo *is* the openwrt
      # tree (built in place), unlike templates that clone into ./openwrt.
      - name: Cache toolchain + ccache
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          toolchain: 'true'
          skip: 'true'
          mixkey: 'siflower-sf19a2890'

      - name: Download sources
        run: make -j$(nproc) download

      - name: Build
        run: |
          make -j$(nproc) || make -j1 V=s   # on failure, re-run verbose single-threaded for logs

      - name: Collect images
        run: |
          mkdir -p out
          cp -v bin/targets/siflower/sf19a2890/*sysupgrade.bin \
                bin/targets/siflower/sf19a2890/*initramfs-kernel.bin \
                bin/targets/siflower/sf19a2890/sha256sums out/ 2>/dev/null || true

      - name: Upload build artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: gl-sft1200-images
          path: out/*
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
